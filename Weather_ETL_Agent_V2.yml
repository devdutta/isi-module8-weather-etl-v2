          \n          confidence = \"MIXED\"\n          confidence_note = f\"{resolved_count}\
          \ resolved, {unresolved_count} unresolved. User review recommended.\"\n\
          \          rounds_needed = 2\n\n      merged = {\n          \"agreement_status\"\
